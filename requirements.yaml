site_name: SmartBranch-01
description: Small branch office network with employee, guest, server and management segments

devices:
  router: "R1 (ISR, sub-interfaces on Gi0/0)"
  switches: ["SW1 (Distribution/L2, VLANs + trunking)", "SW2 (Access)"]
  wireless_ap: "AP1 (Guest SSID: SmartBranch-Guest)"
  server: SRV1 (internal application/file server)
  cloud: Internet (Cisco cloud/PT-Cloud object)
  endpoints: 8+  (6 wired employee PCs/laptops, 2 guest wireless devices, 1 management PC)

vlans:
  - id: 10
    name: EMPLOYEE
    subnet: 10.10.10.0/24
    gateway: 10.10.10.1
    dhcp_pool: 10.10.10.100-10.10.10.200
    internet_access: true
    server_access: true
    management_access: false

  - id: 20
    name: GUEST
    subnet: 10.10.20.0/24
    gateway: 10.10.20.1
    dhcp_pool: 10.10.20.50-10.10.20.150
    internet_access: true
    server_access: false        # blocked by ACL
    management_access: false

  - id: 30
    name: SERVER
    subnet: 10.10.30.0/24
    gateway: 10.10.30.1
    dhcp_pool: static           # server gets a static IP: 10.10.30.10
    internet_access: false      # server does not need to browse the internet
    management_access: true     # management can reach server for admin

  - id: 99
    name: MANAGEMENT
    subnet: 10.10.99.0/24
    gateway: 10.10.99.1
    dhcp_pool: static           # 10.10.99.2 assigned to the management PC
    internet_access: false
    server_access: true
    ssh_source_only: true       # ONLY this VLAN may SSH into network devices

services:
  dhcp: per-VLAN pools on R1 (ip dhcp pool EMP / GUEST)
  dns: forwarded to Google DNS 8.8.8.8 (or PT-Cloud DNS) via R1 helper-address
  nat: PAT (overload) on R1 outside interface toward Internet cloud
  routing: router-on-a-stick using Gi0/0.10 / .20 / .30 / .99 sub-interfaces on R1
  trunking: SW1<->R1 trunk carries VLANs 10,20,30,99; SW1<->SW2 trunk carries 10,20,99 (30 stays on SW1 side near server)

security_rules:
  - name: BLOCK_GUEST_TO_SERVER
    type: extended ACL on R1 (applied inbound on VLAN20 sub-interface)
    rule: deny ip 10.10.20.0 0.0.0.255 10.10.30.0 0.0.0.255; permit ip any any
  - name: BLOCK_GUEST_TO_MGMT
    type: extended ACL on R1
    rule: deny ip 10.10.20.0 0.0.0.255 10.10.99.0 0.0.0.255
  - name: SSH_MGMT_ONLY
    type: line vty access-class + local ACL on all switches/router
    rule: permit tcp 10.10.99.0 0.0.0.255 any eq 22; deny tcp any any eq 22
  - name: PORT_SECURITY
    type: switchport port-security on access ports
    rule: maximum 2 MAC addresses, violation restrict
